<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SUDHIR | PRO PORTAL</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #0f172a;
            --accent: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --nav-bg: rgba(255, 255, 255, 0.7);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
        }

        body.dark {
            --primary: #ffffff;
            --accent: #fbbf24;
            --accent-gradient: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --nav-bg: rgba(2, 6, 23, 0.8);
            --shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, transform 0.2s;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding-bottom: 90px; 
            color: var(--text-main); 
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        /* Notification Bar */
        #broadcast-bar {
            background: var(--accent-gradient);
            color: #000;
            padding: 10px 20px;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 1100;
        }

        /* Header */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            background: var(--nav-bg); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px; cursor: pointer; }
        .logo span { color: var(--accent); }

        /* Container & Elements */
        .container { padding: 24px 20px; max-width: 900px; margin: 0 auto; }
        
        .grid-view { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: var(--radius-xl); 
            padding: 24px 16px; 
            text-align: center; 
            cursor: pointer; 
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }
        
        /* Premium hover/active effect */
        .card:active { transform: scale(0.96); opacity: 0.9; }

        .icon-wrapper { 
            width: 56px; height: 56px; 
            background: var(--accent-gradient); 
            border-radius: var(--radius-lg); 
            display: flex; align-items: center; justify-content: center; 
            margin: 0 auto 16px; 
            box-shadow: 0 8px 16px -4px rgba(245, 158, 11, 0.4);
        }
        .icon-wrapper i { color: #000; width: 24px; height: 24px; }

        h3 { margin: 0; font-size: 15px; font-weight: 700; }

        /* Bottom Navigation */
        .bottom-nav { 
            position: fixed; bottom: 16px; left: 16px; right: 16px; 
            background: var(--nav-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; 
            padding: 12px; 
            border-radius: 30px;
            border: 1px solid var(--card-border); 
            z-index: 2000; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            color: var(--text-sub); font-size: 10px; font-weight: 700; 
            cursor: pointer; gap: 4px; padding: 8px 16px; border-radius: 20px;
        }
        .nav-item.active { color: var(--accent); background: rgba(245, 158, 11, 0.1); }

        /* Tables & Lists */
        .table-wrapper { 
            overflow-x: auto; background: var(--card-bg); 
            border-radius: var(--radius-lg); border: 1px solid var(--card-border); 
            margin-top: 12px; box-shadow: var(--shadow);
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: rgba(148, 163, 184, 0.1); padding: 16px; text-align: left; color: var(--accent); font-weight: 800; border-bottom: 1px solid var(--card-border); }
        td { padding: 16px; border-bottom: 1px solid var(--card-border); color: var(--text-main); }
        tr:last-child td { border-bottom: none; }

        /* Auth Screen */
        #auth-overlay { 
            position: fixed; inset: 0; background: var(--bg); 
            z-index: 9999; display: flex; align-items: center; justify-content: center; 
            padding: 20px;
        }
        .auth-card { 
            background: var(--card-bg); padding: 48px 32px; 
            border-radius: 32px; text-align: center; width: 100%; max-width: 400px; 
            border: 1px solid var(--card-border); box-shadow: var(--shadow);
        }
        .auth-input { 
            width: 100%; padding: 18px; border-radius: 16px; 
            border: 1px solid var(--card-border); background: rgba(148, 163, 184, 0.05);
            margin: 24px 0; text-align: center; font-size: 24px; font-weight: 800;
            color: var(--text-main); outline: none; letter-spacing: 8px;
        }
        .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1); }

        /* Back Button */
        .back-btn {
            display: flex; align-items: center; gap: 8px;
            background: none; border: none; color: var(--accent);
            font-weight: 800; padding: 0 0 20px 0; cursor: pointer;
            font-size: 14px;
        }

        /* PDF Modal Updates */
        #pdf-modal { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; }
        .pdf-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 16px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); color: #fff; 
        }
        .pdf-btn { 
            border: none; padding: 10px 16px; border-radius: 12px; 
            font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; 
        }

        @media (min-width: 600px) {
            .grid-view { grid-template-columns: repeat(3, 1fr); }
            .auth-card { padding: 60px; }
        }
    </style>
</head>
<body class="dark">

<div id="auth-overlay">
    <div class="auth-card">
        <div class="logo" style="font-size: 1.5rem; margin-bottom: 10px;">SUDHIR <span>PORTAL</span></div>
        <p style="color: var(--text-sub); font-size: 14px; margin: 0;">Enter your 4-digit access pin</p>
        <input type="password" id="passInput" class="auth-input" placeholder="••••" maxlength="4" inputmode="numeric">
        <button onclick="checkPass()" style="width:100%; padding:18px; border-radius:16px; border:none; background:var(--accent-gradient); color:#000; font-weight:800; cursor:pointer; font-size: 16px;">LOGIN</button>
    </div>
</div>

<div id="main-content" class="hidden">
    <div id="broadcast-bar" class="hidden">
        <i data-lucide="megaphone" style="width:14px;"></i>
        <span id="broadcast-text"></span>
    </div>

    <nav>
        <div onclick="adminCheck()" class="logo">SUDHIR <span>RENTALS</span></div>
        <div id="themeToggle" style="cursor:pointer; padding: 8px; background: rgba(148, 163, 184, 0.1); border-radius: 12px;">
            <i data-lucide="moon" style="width: 20px;"></i>
        </div>
    </nav>

    <div class="container">
        <!-- Home View -->
        <div id="view-home" class="grid-view">
            <div class="card" onclick="showView('inventory')">
                <div class="icon-wrapper"><i data-lucide="calculator"></i></div>
                <h3>Pricing Tool</h3>
            </div>
            <div class="card" onclick="showView('datasheets')">
                <div class="icon-wrapper"><i data-lucide="scroll-text"></i></div>
                <h3>Datasheets</h3>
            </div>
        </div>

        <!-- Inventory View -->
        <div id="view-inventory" class="hidden">
            <button class="back-btn" onclick="showView('home')"><i data-lucide="chevron-left"></i> BACK TO DASHBOARD</button>
            <div id="inv-cats" class="grid-view"></div>
            <div id="inv-table-view" class="hidden">
                <div class="table-wrapper" id="inv-table-area"></div>
            </div>
        </div>

        <!-- Datasheets View -->
        <div id="view-datasheets" class="hidden">
            <button class="back-btn" onclick="showView('home')"><i data-lucide="chevron-left"></i> BACK TO DASHBOARD</button>
            <div id="ds-cats" class="grid-view"></div>
            <div id="ds-items-screen" class="hidden">
                <div id="ds-items-grid" class="grid-view"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showView('home')"><i data-lucide="layout-grid"></i>DASHBOARD</div>
        <div class="nav-item" onclick="showView('inventory')"><i data-lucide="banknote"></i>PRICES</div>
        <div class="nav-item" onclick="showView('datasheets')"><i data-lucide="file-check"></i>DOCS</div>
    </div>
</div>

<!-- PDF Modal -->
<div id="pdf-modal">
    <div class="pdf-header">
        <span id="pdf-title" style="font-size:14px; font-weight: 700;">Document Viewer</span>
        <div style="display:flex; gap:10px;">
            <button class="pdf-btn" onclick="sharePdf()" style="background:#334155; color:white;"><i data-lucide="share-2" style="width:16px;"></i></button>
            <button class="pdf-btn" onclick="downloadPdf()" style="background:var(--accent-gradient); color:#000;"><i data-lucide="download" style="width:16px;"></i></button>
            <button class="pdf-btn" onclick="closePdf()" style="background:#ef4444; color:white;"><i data-lucide="x" style="width:16px;"></i></button>
        </div>
    </div>
    <div id="pdf-render-area" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; align-items:center; background:#0f172a;"></div>
</div>

<script>
/** 
 * LOGIC REMAINS UNTOUCHED 
 * Only minor UI-related updates (active class toggling) added inside showView
 */
const G_SHEET_ID = '1yn96hq69kWn_MdrFwY_OgUBfhqu-NtJz_LADBxjVrZQ';
const G_API_KEY = 'AIzaSyDUGiUA64AawBtYD-v1Op4lXtW7mX8F4J0';
const GH_CONFIG = { OWNER: "nasirsudhir320-source", REPO: "Datasheets", BRANCH: "main" };
const ADMIN_PASS = "9768";

let inventoryData = {}, datasheetData = {}, currentPdfBlob = null, currentPdfName = "";

// --- AUTH ---
function checkPass() {
    if(document.getElementById('passInput').value === "5511") {
        localStorage.setItem('sudhir_auth_status', 'true');
        unlock();
    } else { alert("Wrong PIN"); }
}

function unlock() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('main-content').classList.remove('hidden');
    init();
}

// --- ADMIN & NOTIFICATION ---
let clicks = 0;
function adminCheck() {
    clicks++;
    if(clicks >= 5) {
        if(prompt("Admin Password:") === ADMIN_PASS) {
            alert("Admin Access Granted.\nTo update the notification for everyone:\n1. Open Google Sheet\n2. Go to 'Notifications' tab\n3. Edit cell A2");
        }
        clicks = 0;
    }
}

async function fetchNotification() {
    try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${G_SHEET_ID}/values/Notifications!A2?key=${G_API_KEY}`);
        const data = await res.json();
        if(data.values && data.values[0]) {
            document.getElementById('broadcast-bar').classList.remove('hidden');
            document.getElementById('broadcast-text').innerText = data.values[0][0];
        }
    } catch(e) {}
}

// --- DATA FETCH ---
async function init() {
    lucide.createIcons();
    fetchNotification();
    await Promise.all([fetchInventory(), fetchDatasheets()]);

    // Theme toggle Logic
    document.getElementById('themeToggle').onclick = () => {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        document.getElementById('themeToggle').innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" style="width:20px"></i>`;
        lucide.createIcons();
    }
}

async function fetchInventory() {
    try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${G_SHEET_ID}?key=${G_API_KEY}`);
        const meta = await res.json();
        for (let s of meta.sheets) {
            const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${G_SHEET_ID}/values/${encodeURIComponent(s.properties.title)}?key=${G_API_KEY}`);
            const d = await r.json();
            if (d.values) {
                const h = d.values[0];
                inventoryData[s.properties.title] = d.values.slice(1).map(row => {
                    let o = {}; h.forEach((l, i) => o[l.trim()] = row[i] || "-"); return o;
                });
            }
        }
    } catch(e) {}
}

async function fetchDatasheets() {
    try {
        const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.OWNER}/${GH_CONFIG.REPO}/git/trees/${GH_CONFIG.BRANCH}?recursive=1`);
        const d = await res.json();
        d.tree.filter(i => i.path.toLowerCase().endsWith('.pdf')).forEach(i => {
            const p = i.path.split('/');
            const c = p.length > 1 ? p[0] : "General";
            if (!datasheetData[c]) datasheetData[c] = [];
            datasheetData[c].push({ name: p.pop().replace('.pdf',''), url: `https://raw.githubusercontent.com/${GH_CONFIG.OWNER}/${GH_CONFIG.REPO}/${GH_CONFIG.BRANCH}/${i.path}` });
        });
    } catch(e) {}
}

// --- NAVIGATION ---
function showView(view) {
    document.getElementById('view-home').classList.add('hidden');
    document.getElementById('view-inventory').classList.add('hidden');
    document.getElementById('view-datasheets').classList.add('hidden');
    document.getElementById('view-' + view).classList.remove('hidden');
    
    // Update bottom nav active state
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
        item.classList.remove('active');
        if(item.innerText.toLowerCase().includes(view === 'home' ? 'dash' : view.slice(0,4))) {
            item.classList.add('active');
        }
    });

    if(view === 'inventory') renderInvCats();
    if(view === 'datasheets') renderDsCats();
    lucide.createIcons();
}

function renderInvCats() {
    document.getElementById('inv-table-view').classList.add('hidden');
    document.getElementById('inv-cats').classList.remove('hidden');
    document.getElementById('inv-cats').innerHTML = Object.keys(inventoryData).map(c => `
        <div class="card" onclick="renderTable('${c.replace(/'/g, "\\'")}')">
            <div class="icon-wrapper"><i data-lucide="layers"></i></div>
            <h3>${c}</h3>
        </div>
    `).join('');
    lucide.createIcons();
}

function renderTable(cat) {
    document.getElementById('inv-cats').classList.add('hidden');
    document.getElementById('inv-table-view').classList.remove('hidden');
    const data = inventoryData[cat];
    const headers = Object.keys(data[0]);
    let html = `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
    data.forEach(row => { html += `<tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>`; });
    document.getElementById('inv-table-area').innerHTML = html + `</tbody></table>`;
}

function renderDsCats() {
    document.getElementById('ds-items-screen').classList.add('hidden');
    document.getElementById('ds-cats').classList.remove('hidden');
    document.getElementById('ds-cats').innerHTML = Object.keys(datasheetData).map(c => `
        <div class="card" onclick="renderDsItems('${c.replace(/'/g, "\\'")}')">
            <div class="icon-wrapper"><i data-lucide="folder"></i></div>
            <h3>${c}</h3>
        </div>
    `).join('');
    lucide.createIcons();
}

function renderDsItems(cat) {
    document.getElementById('ds-cats').classList.add('hidden');
    document.getElementById('ds-items-screen').classList.remove('hidden');
    document.getElementById('ds-items-grid').innerHTML = datasheetData[cat].map(i => `
        <div class="card" onclick="openPdf('${i.url}', '${i.name.replace(/'/g, "\\'")}')">
            <div class="icon-wrapper"><i data-lucide="file-text"></i></div>
            <h3>${i.name}</h3>
        </div>
    `).join('');
    lucide.createIcons();
}

// --- PDF & SHARING ---
async function openPdf(url, name) {
    currentPdfName = name + ".pdf";
    document.getElementById('pdf-modal').style.display = 'flex';
    document.getElementById('pdf-title').innerText = name;
    const area = document.getElementById('pdf-render-area');
    area.innerHTML = '<p style="color:white; margin-top: 50px; font-weight:700;">Loading Document...</p>';
    
    try {
        const res = await fetch(url);
        currentPdfBlob = await res.blob();
        const pdf = await pdfjsLib.getDocument({ data: await currentPdfBlob.arrayBuffer() }).promise;
        area.innerHTML = '';
        for (let n = 1; n <= pdf.numPages; n++) {
            const page = await pdf.getPage(n);
            const canvas = document.createElement('canvas');
            canvas.style.maxWidth = '100%';
            canvas.style.height = 'auto';
            canvas.style.marginBottom = '20px';
            canvas.style.borderRadius = '8px';
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            area.appendChild(canvas);
        }
    } catch(e) { area.innerHTML = '<p style="color:red;">Error loading PDF</p>'; }
}

function closePdf() { document.getElementById('pdf-modal').style.display = 'none'; }

function downloadPdf() {
    const a = document.createElement('a'); a.href = URL.createObjectURL(currentPdfBlob);
    a.download = currentPdfName; a.click();
}

async function sharePdf() {
    const file = new File([currentPdfBlob], currentPdfName, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: currentPdfName });
    } else { alert("Sharing not supported on this browser."); }
}

window.onload = () => { if(localStorage.getItem('sudhir_auth_status') === 'true') unlock(); };
</script>
</body>
</html>
