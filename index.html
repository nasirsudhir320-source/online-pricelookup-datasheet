<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SUDHIR PRO MOBILE</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root { 
            --accent: #fbc531; 
            --accent-dim: rgba(251, 197, 49, 0.15);
            --bg: #05070a; 
            --card: #11141d; 
            --border: rgba(255, 255, 255, 0.08); 
            --text-dim: #94a3b8; 
            --success: #2ecc71; 
            --wa: #25d366; 
            --glass: rgba(17, 20, 29, 0.9);
            --safe-bottom: env(safe-area-inset-bottom);
            --safe-top: env(safe-area-inset-top);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { background: var(--bg); color: #fff; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; background-image: radial-gradient(circle at top right, #1e222d, #05070a); }
        .hidden { display: none !important; }

        /* Sync Indicator Styling */
        .sync-pill { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .status-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; transition: 0.3s; }
        .status-dot.ready { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .sync-text { font-size: 10px; font-weight: 800; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; }

        /* Auth & Sync Overlay */
        #sync-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sync-circle-box { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .sync-svg { transform: rotate(-90deg); width: 120px; height: 120px; position: absolute; }
        .sync-bg { fill: none; stroke: var(--border); stroke-width: 6; }
        .sync-bar { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 339; stroke-dashoffset: 339; transition: stroke-dashoffset 0.4s ease; stroke-linecap: round; }
        .sync-pct { font-size: 20px; font-weight: 800; color: var(--accent); }

        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2500; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; }
        .auth-card { background: var(--card); border: 1px solid var(--border); padding: 40px 30px; border-radius: 32px; width: 100%; max-width: 360px; text-align: center; }
        .pin-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--accent); font-size: 32px; letter-spacing: 12px; text-align: center; width: 100%; padding: 15px; border-radius: 16px; margin-bottom: 20px; outline: none; }

        /* Main Shell */
        #app-shell { display: flex; flex-direction: column; height: 100%; width: 100%; }
        header { padding: calc(var(--safe-top) + 15px) 20px 15px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 22px; }
        .logo span { color: var(--accent); }

        main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 110px; }
        .view-section { padding: 15px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Components */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .dash-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
        .dash-card i { color: var(--accent); }
        .dash-card span { font-size: 12px; font-weight: 800; line-height: 1.3; }

        .group-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin: 25px 0 12px 5px; letter-spacing: 1.5px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-info h4 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .item-info p { font-size: 11px; color: var(--text-dim); }

        .act-btn { background: #1e222d; border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 12px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
        .act-btn.wa { color: var(--wa); }
        .act-btn.success { color: var(--success); }
        .act-btn.primary { color: var(--accent); }

        /* Navigation */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 10px 5px calc(var(--safe-bottom) + 10px); z-index: 2000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); border: none; background: none; cursor: pointer; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab span { font-size: 9px; font-weight: 800; text-transform: uppercase; }

        /* Overlays */
        .overlay-view { position: fixed; inset: 0; background: var(--bg); z-index: 2200; display: flex; flex-direction: column; }
        .overlay-header { padding: calc(var(--safe-top) + 10px) 15px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--card); }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px; }

        #notif-bar { margin: 15px 0; background: var(--accent-dim); border: 1px solid var(--accent-dim); padding: 12px 15px; border-radius: 15px; border-left: 4px solid var(--accent); }
        #notif-text { font-size: 12px; color: #fff; font-weight: 600; }
    </style>
</head>
<body>

<div id="sync-overlay" class="hidden">
    <div class="sync-circle-box">
        <svg class="sync-svg"><circle class="sync-bg" cx="60" cy="60" r="54"></circle><circle id="sync-bar" class="sync-bar" cx="60" cy="60" r="54"></circle></svg>
        <div id="sync-pct" class="sync-pct">0%</div>
    </div>
    <p style="margin-top:20px; font-size:11px; font-weight:800; color:var(--text-dim); letter-spacing:2px">UPDATING DIRECTORY</p>
</div>

<div id="auth-screen">
    <div class="sync-pill" style="margin-bottom: 25px;">
        <div id="auth-dot" class="status-dot"></div>
        <span id="auth-sync-text" class="sync-text">0% SYNCING</span>
    </div>
    <div class="auth-card">
        <div class="logo" style="font-size: 28px;">SUDHIR<span>PRO</span></div>
        <p style="color:var(--text-dim); font-size:12px; margin: 15px 0 25px;">Employee Terminal</p>
        <input type="password" id="pin" class="pin-box" maxlength="4" inputmode="numeric" placeholder="••••" />
        <button id="login-btn" style="width:100%; padding:18px; border-radius:18px; background:var(--border); font-weight:800; border:none; color:var(--text-dim); transition: 0.3s;" onclick="doAuth()">LOGIN</button>
    </div>
</div>

<div id="app-shell" class="hidden">
    <header>
        <div class="logo">SUDHIR<span>PRO</span></div>
        <div class="sync-pill">
            <div id="home-dot" class="status-dot"></div>
            <span id="home-sync-text" class="sync-text">SYNCING</span>
        </div>
    </header>
    
    <main id="main-content">
        <div id="tab-home" class="view-section">
            <h3 class="group-title">COMMAND CENTER</h3>
            <div class="dash-grid">
                <div class="dash-card" onclick="switchTab('rates')"><i data-lucide="tag"></i><span>RENTAL<br>RATES</span></div>
                <div class="dash-card" onclick="switchTab('docs')"><i data-lucide="file-text"></i><span>TECH<br>SPECS</span></div>
                <div class="dash-card" onclick="openPhotos()"><i data-lucide="camera"></i><span>GALLERY</span></div>
                <div class="dash-card" onclick="switchTab('yards')"><i data-lucide="map-pin"></i><span>YARDS</span></div>
            </div>
            <h3 class="group-title">NOTIFICATIONS</h3>
            <div id="notif-bar"><div id="notif-text">Loading updates...</div></div>
        </div>

        <div id="tab-yards" class="view-section hidden"><h3 class="group-title">Operational Yards</h3><div id="yard-list"></div></div>
        <div id="tab-team" class="view-section hidden"><div id="contact-list"></div></div>
        <div id="tab-rates" class="view-section hidden"><h3 class="group-title">Rates</h3><div id="rates-grid" class="dash-grid"></div></div>
        <div id="tab-docs" class="view-section hidden"><h3 class="group-title">Datasheets</h3><div id="docs-grid" class="dash-grid"></div></div>
    </main>

    <nav>
        <button class="nav-tab" onclick="goBack()"><i data-lucide="chevron-left"></i><span>Back</span></button>
        <button class="nav-tab active" id="btn-home" onclick="switchTab('home')"><i data-lucide="home"></i><span>Home</span></button>
        <button class="nav-tab" id="btn-photos" onclick="openPhotos()"><i data-lucide="image"></i><span>Photos</span></button>
        <button class="nav-tab" id="btn-team" onclick="switchTab('team')"><i data-lucide="users"></i><span>Team</span></button>
        <button class="nav-tab" id="btn-yards" onclick="switchTab('yards')"><i data-lucide="map"></i><span>Yards</span></button>
    </nav>
</div>

<div id="detail-layer" class="overlay-view hidden">
    <div class="overlay-header"><button class="act-btn" onclick="goBack()"><i data-lucide="chevron-left"></i></button><div id="detail-title" style="flex:1; font-weight:800; text-align:center;">Details</div><div style="width:42px"></div></div>
    <div class="scroll-area" id="detail-content"></div>
</div>

<div id="pdf-overlay" class="overlay-view hidden" style="background:#000">
    <div class="overlay-header">
        <button class="act-btn" onclick="closePdf()"><i data-lucide="x"></i></button>
        <div id="pdf-title" style="flex:1; font-size:11px; text-align:center;">Viewer</div>
        <button class="act-btn primary" onclick="sharePdf()"><i data-lucide="share-2"></i></button>
        <button class="act-btn primary" onclick="downloadPdf()" style="margin-left:8px;"><i data-lucide="download"></i></button>
    </div>
    <div class="scroll-area" id="pdf-render-box"></div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const CONFIG = {
        SHEET: '1yn96hq69kWn_MdrFwY_OgUBfhqu-NtJz_LADBxjVrZQ',
        KEY: 'AIzaSyDUGiUA64AawBtYD-v1Op4lXtW7mX8F4J0',
        GH: { user: "nasirsudhir320-source", repo: "Datasheets" }
    };

    const YARDS = [
        { n: "Jeddah Yard", u: "https://maps.app.goo.gl/rcF3wBS66RsNnxLh9" },
        { n: "Riyadh AWP Yard", u: "https://maps.app.goo.gl/FTgDVzjYNoZh9rHu8" },
        { n: "Riyadh Genset Yard", u: "https://maps.app.goo.gl/vBy88NCwQN7ZR1uh8" },
        { n: "Dammam Yard", u: "https://maps.app.goo.gl/AXQmg7kAA3oTZ2gX6" },
        { n: "Tabuk Yard", u: "https://maps.app.goo.gl/uK933W3X36C2" }
    ];

    const TEAM_GROUPS = [
        {
            title: "Machine Readiness",
            members: [
                { n: "Althaf (Genset)", d: "Dammam", p: "966581569900" },
                { n: "Rajan (AWP)", d: "Dammam", p: "966550026247" },
                { n: "Aslam (Genset)", d: "Riyadh", p: "966554402641" },
                { n: "Marish (AWP)", d: "Riyadh", p: "966503332535" },
                { n: "Abrar (Genset)", d: "Jeddah", p: "966533315751" },
                { n: "Jitin (AWP)", d: "Jeddah", p: "966558821376" },
                { n: "Rajesh Rajaram", d: "Tabuk (Genset)", p: "966555286534" },
                { n: "Mukesh (AWP)", d: "Tabuk", p: "966552767809" }
            ]
        },
        {
            title: "Breakdown Coordinators",
            members: [
                { n: "Nakul (Genset)", d: "Eastern Region", p: "966509993274" },
                { n: "Ashish (AWP)", d: "Eastern Region", p: "966554412746" },
                { n: "Talha", d: "Central Region", p: "966556665163" },
                { n: "Hamza (Genset)", d: "Western Region", p: "966509993358" },
                { n: "Jitin (AWP)", d: "Western Region", p: "966558821376" },
                { n: "Noor", d: "Tabuk Region", p: "966533306398" }
            ]
        },
        {
            title: "Transportation",
            members: [
                { n: "Naresh", d: "Eastern Region", p: "966539599927" },
                { n: "Kaviraj", d: "Eastern Region", p: "966509992417" },
                { n: "Sadat", d: "Central Region", p: "966509992716" },
                { n: "Shamir", d: "Western Region", p: "966533326321" }
            ]
        },
        {
            title: "Loading In-Charge",
            members: [
                { n: "Althaf (Genset)", d: "Dammam", p: "966581569900" },
                { n: "Soud (AWP)", d: "Dammam", p: "966582727601" },
                { n: "Rony (Genset)", d: "Riyadh", p: "966530894929" },
                { n: "Shanto (AWP)", d: "Riyadh", p: "966565130225" },
                { n: "Shamir", d: "Jeddah", p: "966533326321" },
                { n: "Rajesh Rajaram", d: "Tabuk (Genset)", p: "966555286534" },
                { n: "Mukesh (AWP)", d: "Tabuk", p: "966552767809" }
            ]
        }
    ];

    const EMAILS = [
        { r: "Eastern", e: "service@sudhirrentals.com" },
        { r: "Central", e: "serviceriyadh@sudhirrentals.com" },
        { r: "Western", e: "servicejeddah@sudhirrentals.com" },
        { r: "Tabuk", e: "servicetabuk@sudhirrentals.com" }
    ];

    let db = { rates: {}, docs: {}, notif: "Connected." };
    let currentPdf = { name: "", blob: null, url: "" };
    let activeModuleType = ""; 
    let isDataReady = false;

    window.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        renderYards();
        renderTeam();
        initSync();
    });

    async function initSync() {
        updateSyncProgress(10, "STARTING");
        try {
            await Promise.all([loadRates(), loadDocs()]);
            updateSyncProgress(100, "DB READY");
            
            isDataReady = true;
            document.querySelectorAll('.status-dot').forEach(d => d.classList.add('ready'));
            const loginBtn = document.getElementById('login-btn');
            loginBtn.style.background = 'var(--accent)';
            loginBtn.style.color = '#000';
            
            renderGrids();
            document.getElementById('notif-text').innerText = db.notif;
        } catch(e) {
            updateSyncProgress(0, "SYNC ERROR");
        }
    }

    function updateSyncProgress(pct, text) {
        const bar = document.getElementById('sync-bar');
        if (bar) bar.style.strokeDashoffset = 339 - (pct/100)*339;
        const pctText = document.getElementById('sync-pct');
        if (pctText) pctText.innerText = pct+'%';

        document.getElementById('auth-sync-text').innerText = pct + "% " + text;
        document.getElementById('home-sync-text').innerText = (pct === 100) ? "ONLINE" : pct + "%";
        
        if(pct >= 100) {
            setTimeout(() => { 
                document.getElementById('sync-overlay').classList.add('hidden'); 
            }, 600);
        }
    }

    async function loadRates() {
        try {
            const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET}?key=${CONFIG.KEY}`);
            const meta = await res.json();
            const names = meta.sheets.map(s => s.properties.title);
            const batch = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET}/values:batchGet?key=${CONFIG.KEY}&ranges=${names.join('&ranges=')}`);
            const data = await batch.json();
            data.valueRanges.forEach((vr, i) => {
                if(names[i] === "Notifications") db.notif = vr.values ? vr.values[0][0] : db.notif;
                else if(vr.values) db.rates[names[i]] = vr.values;
            });
            updateSyncProgress(60, "RATES SYNCED");
        } catch(e) {}
    }

    async function loadDocs() {
        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.GH.user}/${CONFIG.GH.repo}/git/trees/main?recursive=1`);
            const data = await res.json();
            data.tree.filter(f => f.path.endsWith('.pdf')).forEach(f => {
                const cat = f.path.split('/')[0] || "General";
                if(!db.docs[cat]) db.docs[cat] = [];
                db.docs[cat].push({ name: f.path.split('/').pop().replace(".pdf",""), url: `https://raw.githubusercontent.com/${CONFIG.GH.user}/${CONFIG.GH.repo}/main/${encodeURIComponent(f.path)}` });
            });
        } catch(e) {}
    }

    function renderYards() {
        document.getElementById('yard-list').innerHTML = YARDS.map(y => `
            <div class="item-card">
                <div class="item-info"><h4>${y.n}</h4><p>Yard Location</p></div>
                <div style="display:flex; gap:8px;">
                    <button class="act-btn" onclick="copyText('${y.u}')"><i data-lucide="copy" size="16"></i></button>
                    <button class="act-btn wa" onclick="window.open('https://wa.me/?text=${encodeURIComponent(y.n + ': ' + y.u)}')"><i data-lucide="message-square" size="16"></i></button>
                    <button class="act-btn primary" onclick="window.open('${y.u}')"><i data-lucide="navigation" size="16"></i></button>
                </div>
            </div>`).join('');
        lucide.createIcons();
    }

    function renderTeam() {
        let html = '';
        TEAM_GROUPS.forEach(group => {
            html += `<h3 class="group-title">${group.title}</h3>`;
            group.members.forEach(m => {
                html += `
                <div class="item-card">
                    <div class="item-info"><h4>${m.n}</h4><p>${m.d}</p></div>
                    <div style="display:flex; gap:8px;">
                        <button class="act-btn" onclick="copyText('${m.p}')"><i data-lucide="copy" size="16"></i></button>
                        <button class="act-btn wa" onclick="window.open('https://wa.me/${m.p}')"><i data-lucide="message-square" size="16"></i></button>
                        <a href="tel:${m.p}" class="act-btn success"><i data-lucide="phone" size="16"></i></a>
                    </div>
                </div>`;
            });
        });

        html += `<h3 class="group-title">Service Emails</h3>`;
        EMAILS.forEach(em => {
            html += `
            <div class="item-card">
                <div class="item-info"><h4>${em.r}</h4><p>${em.e}</p></div>
                <div style="display:flex; gap:8px;">
                    <button class="act-btn" onclick="copyText('${em.e}')"><i data-lucide="copy" size="16"></i></button>
                    <a href="mailto:${em.e}" class="act-btn primary"><i data-lucide="mail" size="16"></i></a>
                </div>
            </div>`;
        });
        
        document.getElementById('contact-list').innerHTML = html;
        lucide.createIcons();
    }

    function renderGrids() {
        document.getElementById('rates-grid').innerHTML = Object.keys(db.rates).map(cat => `<div class="dash-card" onclick="viewRates('${cat}')"><i data-lucide="tag"></i><span>${cat}</span></div>`).join('');
        document.getElementById('docs-grid').innerHTML = Object.keys(db.docs).map(cat => `<div class="dash-card" onclick="viewDocs('${cat}')"><i data-lucide="file-text"></i><span>${cat}</span></div>`).join('');
        lucide.createIcons();
    }

    function viewRates(cat) {
        activeModuleType = "rates";
        const rows = db.rates[cat];
        document.getElementById('detail-layer').classList.remove('hidden');
        document.getElementById('detail-title').innerText = cat;
        let html = `<div style="overflow-x:auto"><table style="width:100%; border-collapse:collapse;"><thead><tr>${rows[0].map(h => `<th style="text-align:left; padding:10px; font-size:10px; color:var(--text-dim); border-bottom:1px solid var(--border);">${h}</th>`).join('')}</tr></thead><tbody>`;
        rows.slice(1).forEach(r => html += `<tr>${r.map(c => `<td style="padding:10px; font-size:12px; border-bottom:1px solid var(--border);">${c}</td>`).join('')}</tr>`);
        document.getElementById('detail-content').innerHTML = html + `</tbody></table></div>`;
    }

    function viewDocs(cat) {
        activeModuleType = "docs";
        document.getElementById('detail-layer').classList.remove('hidden');
        document.getElementById('detail-title').innerText = cat;
        document.getElementById('detail-content').innerHTML = db.docs[cat].map(f => `
            <div class="item-card" onclick="openPdf('${f.url}', '${f.name}')">
                <div class="item-info"><h4>${f.name}</h4><p>Technical PDF</p></div>
                <i data-lucide="eye" style="color:var(--accent)"></i>
            </div>`).join('');
        lucide.createIcons();
    }

    async function openPdf(url, name) {
        currentPdf = { name, url, blob: null };
        document.getElementById('pdf-overlay').classList.remove('hidden');
        const box = document.getElementById('pdf-render-box');
        box.innerHTML = `<div style="padding:100px 0; text-align:center; color:var(--accent); font-weight:800;">LOADING PDF...</div>`;
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            currentPdf.blob = blob;
            const pdf = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
            box.innerHTML = "";
            for(let i=1; i<=pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const canvas = document.createElement('canvas');
                const viewport = page.getViewport({ scale: 1.2 });
                canvas.width = viewport.width; canvas.height = viewport.height;
                canvas.style.width = "100%"; canvas.style.height = "auto"; canvas.style.marginBottom = "10px"; canvas.style.borderRadius = "8px";
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                box.appendChild(canvas);
            }
        } catch(e) { box.innerHTML = "Error loading file."; }
    }

    function downloadPdf() { if(currentPdf.blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(currentPdf.blob); a.download = `${currentPdf.name}.pdf`; a.click(); } }
    async function sharePdf() { 
        if(!currentPdf.blob) return;
        const file = new File([currentPdf.blob], `${currentPdf.name}.pdf`, { type: 'application/pdf' });
        try { await navigator.share({ files: [file], title: currentPdf.name }); } catch(e) { navigator.share({ url: currentPdf.url }); }
    }

    function switchTab(tab) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
        document.getElementById('tab-'+tab).classList.remove('hidden');
        document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
        const btn = document.getElementById('btn-'+tab);
        if(btn) btn.classList.add('active');
        document.getElementById('main-content').scrollTop = 0;
    }

    function doAuth() {
        if(document.getElementById('pin').value === '5511' && isDataReady) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-shell').classList.remove('hidden');
        } else if(!isDataReady) alert("Please wait for sync to finish.");
        else alert("Invalid PIN");
    }

    function copyText(t) { navigator.clipboard.writeText(t); alert("Copied!"); }
    function openPhotos() { window.open("https://nasirowayne-wq.github.io/Machine-Photos/", "_blank"); }
    
    function closeDetails() { 
        document.getElementById('detail-layer').classList.add('hidden'); 
    }
    
    function closePdf() { 
        document.getElementById('pdf-overlay').classList.add('hidden'); 
    }
    
    function goBack() { 
        const isPdfOpen = !document.getElementById('pdf-overlay').classList.contains('hidden');
        const isDetailOpen = !document.getElementById('detail-layer').classList.contains('hidden');

        if (isPdfOpen) {
            closePdf();
            return; 
        } 
        if (isDetailOpen) {
            closeDetails();
            if (activeModuleType === "rates") {
                switchTab('rates');
            } else if (activeModuleType === "docs") {
                switchTab('docs');
            } else {
                switchTab('home');
            }
            return;
        }
        
        switchTab('home'); 
    }
</script>
</body>
</html>
