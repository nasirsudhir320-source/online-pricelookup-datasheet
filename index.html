<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SUDHIR | PRO PORTAL</title>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
:root {
    --primary: #0f172a; --accent: #f37021; --accent-glow: rgba(243, 112, 33, 0.25);
    --accent-gradient: linear-gradient(135deg, #f37021 0%, #ff6b35 50%, #f97316 100%);
    --bg-gradient: linear-gradient(180deg, #0f172a 0%, #020617 100%);
    --card-bg: rgba(30, 41, 59, 0.75); --card-border: rgba(51, 65, 85, 0.5);
    --text: #f8fafc; --muted: #94a3b8; --border: rgba(51, 65, 85, 0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: var(--bg-gradient); margin: 0; padding-bottom: 100px; color: var(--text); min-height: 100vh; }
.hidden { display: none !important; }

/* Auth Overlay */
#auth-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg-gradient); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
.auth-card { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid var(--card-border); text-align: center; max-width: 320px; width: 90%; }
#pass-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 18px; text-align: center; letter-spacing: 4px; margin-bottom: 16px; outline: none; }
.btn-login { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent-gradient); color: white; font-weight: 700; cursor: pointer; }

/* Navigation */
nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--card-border); }
nav .logo { font-weight: 800; font-size: 1.15em; cursor: pointer; }
nav .logo span { color: var(--accent); margin-left: 6px; }

.container { padding: 20px 16px; max-width: 480px; margin: 0 auto; }
.grid-view { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px 16px; text-align: center; cursor: pointer; transition: 0.3s; }
.card .icon-wrapper { width: 45px; height: 45px; border-radius: 12px; background: var(--accent-glow); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
.card i { color: var(--accent); width: 22px; height: 22px; }

/* Table Styling */
.table-wrapper { overflow-x: auto; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border); margin-top: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--accent-glow); padding: 12px; color: var(--accent); text-align: left; }
td { padding: 12px; border-bottom: 1px solid var(--border); }

/* PDF Viewer */
#pdf-modal { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; }
.pdf-header { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #1e293b; }
.pdf-actions { display: flex; gap: 8px; }
.pdf-btn { border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.share-btn { background: var(--accent-gradient); color: #fff; }
.close-btn { background: #ef4444; color: #fff; }
#pdf-render-area { flex: 1; overflow-y: auto; padding: 10px; background: #0f172a; text-align: center; }
canvas { max-width: 100%; margin-bottom: 8px; border-radius: 4px; }

#loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--accent-gradient); color: #fff; padding: 12px 24px; border-radius: 30px; z-index: 4000; font-weight: 700; }
.btn-back { display: flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--accent); padding: 10px 16px; border-radius: 12px; margin-bottom: 16px; cursor: pointer; font-weight: 600; width: fit-content; }
</style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <div class="logo" style="margin-bottom: 20px;">SUDHIR <span>PORTAL</span></div>
        <input type="password" id="pass-input" placeholder="••••" maxlength="4">
        <button class="btn-login" onclick="checkPass()">ACCESS</button>
    </div>
</div>

<div id="main-content" class="hidden">
    <div id="loader" class="hidden">Syncing Data...</div>
    <nav><div onclick="showView('home')" class="logo">SUDHIR <span>RENTALS</span></div></nav>
    <div class="container">
        <div id="view-home" class="grid-view">
            <div class="card" onclick="showView('inventory')"><div class="icon-wrapper"><i data-lucide="calculator"></i></div><h3>Pricing</h3></div>
            <div class="card" onclick="showView('datasheets')"><div class="icon-wrapper"><i data-lucide="scroll-text"></i></div><h3>Specs</h3></div>
        </div>
        
        <div id="view-inventory" class="hidden">
            <button class="btn-back" onclick="showView('home')"><i data-lucide="chevron-left"></i> Back</button>
            <div id="inv-cats" class="grid-view"></div>
            <div id="inv-table-view" class="hidden">
                <button class="btn-back" onclick="showView('inventory')"><i data-lucide="chevron-left"></i> Categories</button>
                <div class="table-wrapper" id="inv-table-area"></div>
            </div>
        </div>

        <div id="view-datasheets" class="hidden">
            <button class="btn-back" onclick="showView('home')"><i data-lucide="chevron-left"></i> Back</button>
            <div id="ds-cats" class="grid-view"></div>
            <div id="ds-items-screen" class="hidden">
                <button class="btn-back" onclick="showDatasheetCats()"><i data-lucide="chevron-left"></i> Folders</button>
                <div id="ds-items-grid" class="grid-view"></div>
            </div>
        </div>
    </div>
</div>

<div id="pdf-modal">
    <div class="pdf-header">
        <span id="pdf-title" style="font-size:12px; color:#94a3b8;">Viewer</span>
        <div class="pdf-actions">
            <button class="pdf-btn share-btn" onclick="openInLocalApp()">
                <i data-lucide="external-link" style="width:14px;"></i> Open in App
            </button>
            <button class="pdf-btn close-btn" onclick="closePdf()">X</button>
        </div>
    </div>
    <div id="pdf-render-area"></div>
</div>

<script>
const G_SHEET_ID = '1yn96hq69kWn_MdrFwY_OgUBfhqu-NtJz_LADBxjVrZQ';
const G_API_KEY = 'AIzaSyDUGiUA64AawBtYD-v1Op4lXtW7mX8F4J0';
const GH_CONFIG = { OWNER: "nasirsudhir320-source", REPO: "Datasheets", BRANCH: "main" };

let inventoryData = {}, datasheetData = {}, currentPdfBlob = null, currentPdfUrl = "";

function checkPass() {
    if(document.getElementById('pass-input').value === '5511') {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('main-content').classList.remove('hidden');
        init();
    } else { alert('Access Denied'); }
}

async function init() {
    lucide.createIcons();
    document.getElementById('loader').classList.remove('hidden');
    await Promise.all([fetchInventory(), fetchDatasheets()]);
    document.getElementById('loader').classList.add('hidden');
    showView('home');
}

async function fetchInventory() {
    try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${G_SHEET_ID}?key=${G_API_KEY}`);
        const meta = await res.json();
        for (let s of meta.sheets) {
            const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${G_SHEET_ID}/values/${encodeURIComponent(s.properties.title)}?key=${G_API_KEY}`);
            const d = await r.json();
            if (d.values) {
                const h = d.values[0];
                inventoryData[s.properties.title] = d.values.slice(1).map(row => {
                    let o = {}; h.forEach((l, i) => o[l.trim()] = row[i] || "-"); return o;
                });
            }
        }
    } catch(e) {}
}

async function fetchDatasheets() {
    try {
        const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.OWNER}/${GH_CONFIG.REPO}/git/trees/${GH_CONFIG.BRANCH}?recursive=1`);
        const d = await res.json();
        datasheetData = {};
        d.tree.filter(i => i.path.toLowerCase().endsWith('.pdf')).forEach(i => {
            const p = i.path.split('/');
            const c = p.length > 1 ? p[0] : "General";
            if (!datasheetData[c]) datasheetData[c] = [];
            datasheetData[c].push({ name: p.pop().replace('.pdf',''), url: `https://raw.githubusercontent.com/${GH_CONFIG.OWNER}/${GH_CONFIG.REPO}/${GH_CONFIG.BRANCH}/${i.path}` });
        });
    } catch(e) {}
}

function showView(view) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById('view-' + view).classList.remove('hidden');
    if(view === 'inventory') renderInventoryCats();
    if(view === 'datasheets') showDatasheetCats();
    lucide.createIcons();
}

function renderInventoryCats() {
    document.getElementById('inv-cats').innerHTML = Object.keys(inventoryData).map(cat => `
        <div class="card" onclick="renderTable('${cat}')"><div class="icon-wrapper"><i data-lucide="layers"></i></div><h3>${cat}</h3></div>`).join('');
    lucide.createIcons();
}

function renderTable(cat) {
    document.getElementById('inv-cats').classList.add('hidden');
    document.getElementById('inv-table-view').classList.remove('hidden');
    const data = inventoryData[cat];
    const h = Object.keys(data[0]);
    let html = `<table><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>`;
    data.forEach(r => { html += `<tr>${h.map(x => `<td>${r[x]}</td>`).join('')}</tr>`; });
    document.getElementById('inv-table-area').innerHTML = html + `</tbody></table>`;
}

function showDatasheetCats() {
    document.getElementById('ds-items-screen').classList.add('hidden');
    document.getElementById('ds-cats').classList.remove('hidden');
    document.getElementById('ds-cats').innerHTML = Object.keys(datasheetData).map(c => `
        <div class="card" onclick="showItems('${c}')"><div class="icon-wrapper"><i data-lucide="folder"></i></div><h3>${c}</h3></div>`).join('');
    lucide.createIcons();
}

function showItems(cat) {
    document.getElementById('ds-cats').classList.add('hidden');
    document.getElementById('ds-items-screen').classList.remove('hidden');
    document.getElementById('ds-items-grid').innerHTML = datasheetData[cat].map(i => `
        <div class="card" onclick="openPdf('${i.url}', '${i.name}')"><div class="icon-wrapper"><i data-lucide="file-text"></i></div><h3>${i.name}</h3></div>`).join('');
    lucide.createIcons();
}

async function openPdf(url, name) {
    currentPdfUrl = url;
    document.getElementById('pdf-modal').style.display = 'flex';
    document.getElementById('pdf-title').innerText = name;
    const area = document.getElementById('pdf-render-area');
    area.innerHTML = '<div style="color:#94a3b8;padding:40px;">Generating Preview...</div>';
    try {
        const res = await fetch(url);
        currentPdfBlob = await res.blob();
        const buffer = await currentPdfBlob.arrayBuffer();
        area.innerHTML = '';
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        for (let n = 1; n <= pdf.numPages; n++) {
            const page = await pdf.getPage(n);
            const vp = page.getViewport({ scale: 1.2 });
            const canvas = document.createElement('canvas');
            canvas.height = vp.height; canvas.width = vp.width;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            area.appendChild(canvas);
        }
    } catch(e) { area.innerHTML = 'Error Loading PDF.'; }
}

// ✅ HANDOFF TO LOCAL APP
async function openInLocalApp() {
    const name = document.getElementById('pdf-title').innerText;
    try {
        // Ensure background fetch is done
        if (!currentPdfBlob && currentPdfUrl) {
            const res = await fetch(currentPdfUrl);
            currentPdfBlob = await res.blob();
        }

        if (currentPdfBlob) {
            const file = new File([currentPdfBlob], `${name}.pdf`, { type: 'application/pdf' });
            
            // This triggers the native mobile menu. Selecting "Open In..." or "Save to Files" 
            // allows the user to open it in any local PDF reader.
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: name
                });
            } else {
                // For desktop fallback
                const url = URL.createObjectURL(currentPdfBlob);
                window.open(url, '_blank');
            }
        }
    } catch (err) {
        if(err.name !== 'AbortError') {
            const url = URL.createObjectURL(currentPdfBlob);
            window.open(url, '_blank');
        }
    }
}

function closePdf() { document.getElementById('pdf-modal').style.display = 'none'; currentPdfBlob = null; }
</script>
</body>
</html>
