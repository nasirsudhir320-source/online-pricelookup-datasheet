<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SUDHIR PRO MOBILE</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root { --accent: #22d3ee; --bg: #020617; --card: #0f172a; --border: #1e293b; --text-dim: #94a3b8; --success: #4ade80; --wa: #25d366; --error: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Central Sync Visibility */
        #sync-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sync-circle-box { position: relative; width: 100px; height: 100px; }
        .sync-svg { transform: rotate(-90deg); width: 100px; height: 100px; }
        .sync-bg { fill: none; stroke: var(--border); stroke-width: 8; }
        .sync-bar { fill: none; stroke: var(--accent); stroke-width: 8; stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 0.3s ease; stroke-linecap: round; }
        .sync-pct { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; font-weight: 800; }

        /* Notification on Top */
        .top-notif { background: rgba(34, 211, 238, 0.1); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .top-notif i { color: var(--accent); }
        .top-notif span { font-size: 12px; font-weight: 600; color: #fff; }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 24px; width: 100%; max-width: 320px; text-align: center; }
        .pin-box { background: var(--bg); border: 1px solid var(--border); color: var(--accent); font-size: 32px; letter-spacing: 15px; text-align: center; width: 100%; padding: 15px; border-radius: 12px; margin-bottom: 20px; outline: none; }

        /* Main Shell */
        #app-shell { display: flex; flex-direction: column; height: 100vh; }
        header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(2,6,23,0.8); backdrop-filter: blur(10px); }
        .logo { font-weight: 800; font-size: 18px; }
        .logo span { color: var(--accent); }

        main { flex: 1; overflow-y: auto; padding-bottom: 120px; }
        .view-section { padding: 15px; animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Dashboard Grid */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .dash-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
        .dash-card i { color: var(--accent); }
        .dash-card span { font-size: 12px; font-weight: 700; color: #fff; }

        /* Standard Grid */
        .mobile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .grid-box span { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-top: 8px; }

        /* Item Cards */
        .group-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin: 20px 0 10px 5px; border-left: 3px solid var(--accent); padding-left: 8px; }
        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-info h4 { font-size: 13px; }
        .item-info p { font-size: 11px; color: var(--text-dim); }
        .item-actions { display: flex; gap: 6px; }
        .act-btn { background: #1e293b; border: none; padding: 10px; border-radius: 8px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; }
        .act-btn.primary { color: var(--accent); }
        .act-btn.success { color: var(--success); }
        .act-btn.wa { color: var(--wa); }

        /* Overlays */
        .overlay-view { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; }
        .overlay-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; background: var(--card); }
        .scroll-area { flex: 1; overflow: auto; padding: 10px 10px 100px 10px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #1e293b; padding: 10px; text-align: left; color: var(--text-dim); }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
        
        #pdf-render-box canvas { width: 100%; height: auto !important; margin-bottom: 10px; border-radius: 4px; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; padding: 10px 0 calc(env(safe-area-inset-bottom) + 5px); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); border: none; background: none; outline: none; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab span { font-size: 9px; font-weight: 700; }

        .error-msg { color: var(--error); padding: 20px; text-align: center; font-size: 13px; }
        .retry-btn { margin-top: 10px; padding: 10px 20px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 700; }
    </style>
</head>
<body>

<div id="sync-overlay" class="hidden">
    <div class="sync-circle-box">
        <svg class="sync-svg">
            <circle class="sync-bg" cx="50" cy="50" r="45"></circle>
            <circle id="sync-bar" class="sync-bar" cx="50" cy="50" r="45"></circle>
        </svg>
        <div id="sync-pct" class="sync-pct">0%</div>
    </div>
    <p style="margin-top:15px; font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:1px">SYNCING DATABASE</p>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h2 style="margin-bottom:10px">SUDHIR PRO</h2>
        <input type="password" id="pin" class="pin-box" maxlength="4" inputmode="numeric" placeholder="••••" />
        <button style="width:100%; padding:15px; border-radius:12px; background:var(--accent); font-weight:800; border:none; color: #000" onclick="doAuth()">LOGIN</button>
    </div>
</div>

<div id="app-shell" class="hidden">
    <header>
        <div class="logo">SUDHIR<span>PRO</span></div>
        <div style="font-size: 10px; color: var(--text-dim); font-weight: 600;">PORTAL</div>
    </header>

    <main id="main-content">
        <div id="tab-home" class="view-section">
            <div id="top-notification" class="top-notif hidden">
                <i data-lucide="bell-ring" size="18"></i>
                <span id="notif-text">Syncing notifications...</span>
            </div>

            <h3 style="font-size:12px; color:var(--text-dim); margin-bottom:15px">QUICK NAVIGATOR</h3>
            <div class="dash-grid">
                <div class="dash-card" onclick="switchTab('rates')"><i data-lucide="calculator" size="28"></i><span>PRICE LOOKUP</span></div>
                <div class="dash-card" onclick="switchTab('docs')"><i data-lucide="file-text" size="28"></i><span>DATASHEETS</span></div>
                <div class="dash-card" onclick="openMachinePhotos()"><i data-lucide="camera" size="28"></i><span>MACHINE PHOTOS</span></div>
                <div class="dash-card" onclick="switchTab('yards')"><i data-lucide="map-pin" size="28"></i><span>YARD LOCATION</span></div>
                <div class="dash-card" onclick="switchTab('team')"><i data-lucide="phone-forwarded" size="28"></i><span>TEAM CONTACT</span></div>
            </div>
        </div>
        <div id="tab-yards" class="view-section hidden"><h3 style="font-size:12px; color:var(--text-dim); margin-bottom:15px">YARD LOCATIONS</h3><div id="yard-list"></div></div>
        <div id="tab-team" class="view-section hidden"><div id="contact-list"></div></div>
        <div id="tab-rates" class="view-section hidden"><div id="rates-grid" class="mobile-grid"></div></div>
        <div id="tab-docs" class="view-section hidden"><div id="docs-grid" class="mobile-grid"></div></div>
    </main>

    <nav>
        <button class="nav-tab" onclick="goBack()"><i data-lucide="chevron-left"></i><span>BACK</span></button>
        <button class="nav-tab active" id="btn-home" onclick="switchTab('home')"><i data-lucide="home"></i><span>HOME</span></button>
        <button class="nav-tab" id="btn-rates" onclick="switchTab('rates')"><i data-lucide="calculator"></i><span>RATES</span></button>
        <button class="nav-tab" id="btn-photos" onclick="openMachinePhotos()"><i data-lucide="camera"></i><span>PHOTOS</span></button>
        <button class="nav-tab" id="btn-team" onclick="switchTab('team')"><i data-lucide="users"></i><span>TEAM</span></button>
    </nav>
</div>

<div id="detail-layer" class="overlay-view hidden">
    <div class="overlay-header">
        <button style="background:none; border:none; color:white" onclick="closeDetails()"><i data-lucide="arrow-left"></i></button>
        <div id="detail-title" style="font-weight:700; font-size:14px">Details</div>
    </div>
    <div class="scroll-area" id="detail-content"></div>
</div>

<div id="pdf-overlay" class="overlay-view hidden" style="background:#000">
    <div class="overlay-header" style="background:#111">
        <button style="background:none; border:none; color:white" onclick="closePdf()"><i data-lucide="x"></i></button>
        <div id="pdf-title" style="flex:1; font-size:11px; color:var(--text-dim); overflow:hidden; white-space:nowrap">Document</div>
        <button style="background:none; border:none; color:var(--accent)" onclick="shareCurrentFile()"><i data-lucide="share-2"></i></button>
        <button style="background:none; border:none; color:white; margin-left:15px" onclick="downloadCurrentFile()"><i data-lucide="download"></i></button>
    </div>
    <div class="scroll-area" id="pdf-render-box"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

const CONFIG = {
    SHEET: '1yn96hq69kWn_MdrFwY_OgUBfhqu-NtJz_LADBxjVrZQ',
    KEY: 'AIzaSyDUGiUA64AawBtYD-v1Op4lXtW7mX8F4J0',
    GH: { user: "nasirsudhir320-source", repo: "Datasheets" },
    PHOTOS_URL: "https://nasirowayne-wq.github.io/Machine-Photos/"
};

const YARD_DATA = [
    { n: "Jeddah Yard", u: "https://maps.app.goo.gl/UtBuiZgZFWYccafP7" },
    { n: "Riyadh AWP Yard", u: "https://maps.app.goo.gl/rcF3wBS66RsNnxLh9" },
    { n: "Riyadh Genset Yard", u: "https://maps.app.goo.gl/FTgDVzjYNoZh9rHu8" },
    { n: "Dammam Yard", u: "https://maps.app.goo.gl/vBy88NCwQN7ZR1uh8" },
    { n: "Tabuk Yard", u: "https://maps.app.goo.gl/AXQmg7kAA3oTZ2gX6" }
];

const TEAM_DATA = [
    { cat: "Service Coordinators", items: [
        { n: "Nakul (Eastern)", d: "Genset Service", p: "966509993274" },
        { n: "Ashish (Eastern)", d: "AWP Service", p: "966554412746" },
        { n: "Talha (Central)", d: "Service Coord.", p: "966556665163" },
        { n: "Hamza (Western)", d: "Genset Service", p: "966509993358" },
        { n: "Jitin (Western)", d: "AWP Service", p: "966558821376" },
        { n: "Noor (Tabuk)", d: "Service Coord.", p: "966533306398" }
    ]},
    { cat: "Transportation", items: [
        { n: "Naresh", d: "Eastern Region", p: "966539599927" },
        { n: "Kaviraj", d: "Eastern Region", p: "966509992417" },
        { n: "Sadat", d: "Central Region", p: "966509992716" },
        { n: "Shamir", d: "Western Region", p: "966533326321" }
    ]},
    { cat: "Loading In-Charge", items: [
        { n: "Althaf (Genset)", d: "Dammam Yard", p: "966581569900" },
        { n: "Soud (AWP)", d: "Dammam Yard", p: "966582727601" },
        { n: "Rony (Genset)", d: "Riyadh Yard", p: "966530894929" },
        { n: "Shanto (AWP)", d: "Riyadh Yard", p: "966565130225" },
        { n: "Rajesh (Genset)", d: "Tabuk Yard", p: "966555286534" },
        { n: "Mukesh (AWP)", d: "Tabuk Yard", p: "966552767809" }
    ]}
];

let db = { rates: {}, docs: {} };
let currentFile = { name: "", url: "", blob: null };

function updateSync(pct) {
    const bar = document.getElementById('sync-bar');
    const label = document.getElementById('sync-pct');
    bar.style.strokeDashoffset = 283 - (pct / 100) * 283;
    label.innerText = pct + '%';
    if(pct >= 100) setTimeout(() => {
        document.getElementById('sync-overlay').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
    }, 800);
}

function doAuth() {
    if(document.getElementById('pin').value === '5511') {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('sync-overlay').classList.remove('hidden');
        init();
    } else alert("Invalid PIN");
}

async function init() {
    lucide.createIcons();
    renderYards();
    renderTeam();
    updateSync(10);
    await loadRates();
    updateSync(50);
    await loadDocs();
    updateSync(80);
    await loadNotif();
    updateSync(100);
    renderGrids();
}

async function loadNotif() {
    try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET}/values/Notifications!A1?key=${CONFIG.KEY}`);
        const data = await res.json();
        if(data.values) {
            document.getElementById('top-notification').classList.remove('hidden');
            document.getElementById('notif-text').innerText = data.values[0][0];
        }
    } catch(e) {}
}

function renderYards() {
    let html = "";
    YARD_DATA.forEach(y => {
        html += `<div class="item-card"><div class="item-info"><h4>${y.n}</h4><p>Maps Link</p></div><div class="item-actions"><button class="act-btn" onclick="copyText('${y.u}')"><i data-lucide="copy" size="16"></i></button><button class="act-btn wa" onclick="openWA('0', 'Location for ${y.n}: ${y.u}')"><i data-lucide="message-circle" size="16"></i></button><button class="act-btn primary" onclick="window.open('${y.u}')"><i data-lucide="map" size="16"></i></button></div></div>`;
    });
    document.getElementById('yard-list').innerHTML = html;
    lucide.createIcons();
}

function renderTeam() {
    let html = "";
    TEAM_DATA.forEach(group => {
        html += `<div class="group-title">${group.cat}</div>`;
        group.items.forEach(i => {
            html += `<div class="item-card"><div class="item-info"><h4>${i.n}</h4><p>${i.d}</p></div><div class="item-actions"><button class="act-btn" onclick="copyText('${i.p}')"><i data-lucide="copy" size="16"></i></button><button class="act-btn wa" onclick="openWA('${i.p}', 'Hello ${i.n}, inquiring about ${i.d}')"><i data-lucide="message-circle" size="16"></i></button><a href="tel:${i.p}" class="act-btn success"><i data-lucide="phone" size="16"></i></a></div></div>`;
        });
    });
    document.getElementById('contact-list').innerHTML = html;
    lucide.createIcons();
}

function openWA(num, msg) { window.open(num === '0' ? `https://wa.me/?text=${encodeURIComponent(msg)}` : `https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank'); }
function copyText(txt) { navigator.clipboard.writeText(txt); alert("Copied!"); }

async function loadRates() {
    try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET}?key=${CONFIG.KEY}`);
        const meta = await res.json();
        for(let s of meta.sheets) {
            const name = s.properties.title;
            if(name === "Notifications") continue;
            const dRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET}/values/${encodeURIComponent(name)}?key=${CONFIG.KEY}`);
            const data = await dRes.json();
            if(data.values) db.rates[name] = data.values;
        }
    } catch(e) {}
}

async function loadDocs() {
    try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.GH.user}/${CONFIG.GH.repo}/git/trees/main?recursive=1`);
        const data = await res.json();
        data.tree.filter(f => f.path.toLowerCase().endsWith('.pdf')).forEach(f => {
            const cat = f.path.split('/')[0] || "General";
            if(!db.docs[cat]) db.docs[cat] = [];
            db.docs[cat].push({ name: f.path.split('/').pop().replace(/\.[^/.]+$/, ""), url: `https://raw.githubusercontent.com/${CONFIG.GH.user}/${CONFIG.GH.repo}/main/${encodeURIComponent(f.path)}` });
        });
    } catch(e) {}
}

function renderGrids() {
    document.getElementById('rates-grid').innerHTML = Object.keys(db.rates).map(cat => `<div class="grid-box" onclick="viewRatesTable('${cat}')"><i data-lucide="calculator"></i><span>${cat}</span></div>`).join('');
    document.getElementById('docs-grid').innerHTML = Object.keys(db.docs).map(cat => `<div class="grid-box" onclick="viewDocsList('${cat}')"><i data-lucide="file-text"></i><span>${cat}</span></div>`).join('');
    lucide.createIcons();
}

function switchTab(tab) {
    // Force close any overlays when switching main tabs
    closeDetails();
    closePdf();
    
    document.getElementById('main-content').scrollTop = 0;
    document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
    document.getElementById('tab-'+tab).classList.remove('hidden');
    
    document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
    if(tab === 'home') document.getElementById('btn-home').classList.add('active');
    else if(tab === 'rates') document.getElementById('btn-rates').classList.add('active');
    else if(tab === 'team') document.getElementById('btn-team').classList.add('active');
}

function openMachinePhotos() {
    window.open(CONFIG.PHOTOS_URL, '_blank');
}

function goBack() {
    if(!document.getElementById('detail-layer').classList.contains('hidden')) { closeDetails(); return; }
    if(!document.getElementById('pdf-overlay').classList.contains('hidden')) { closePdf(); return; }
    switchTab('home');
}

function viewRatesTable(cat) {
    const rows = db.rates[cat];
    document.getElementById('detail-layer').classList.remove('hidden');
    document.getElementById('detail-title').innerText = cat;
    let html = `<table><thead><tr>${rows[0].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
    rows.slice(1).forEach(r => html += `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`);
    document.getElementById('detail-content').innerHTML = html + `</tbody></table>`;
}

function viewDocsList(cat) {
    document.getElementById('detail-layer').classList.remove('hidden');
    document.getElementById('detail-title').innerText = cat;
    document.getElementById('detail-content').innerHTML = db.docs[cat].map(f => `<div class="item-card" onclick="openPdf('${f.url}', '${f.name}')"><div class="item-info"><h4>${f.name}</h4><p>Datasheet</p></div><i data-lucide="eye" style="color:var(--accent)"></i></div>`).join('');
    lucide.createIcons();
}

async function openPdf(url, name) {
    currentFile = { url, name, blob: null };
    const overlay = document.getElementById('pdf-overlay');
    const box = document.getElementById('pdf-render-box');
    overlay.classList.remove('hidden');
    box.innerHTML = `<div style="padding:40px; text-align:center"><p style="color:var(--accent)">Connecting...</p></div>`;

    try {
        const response = await fetch(url);
        const blob = await response.blob();
        currentFile.blob = blob;
        
        const pdfData = new Uint8Array(await blob.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
        box.innerHTML = "";
        for(let i=1; i<=pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const canvas = document.createElement('canvas');
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            box.appendChild(canvas);
        }
    } catch (err) {
        box.innerHTML = `<div class="error-msg"><p>Failed to load.</p><button class="retry-btn" onclick="window.open('${url}', '_blank')">Open Browser</button></div>`;
    }
}

async function shareCurrentFile() {
    if (!currentFile.blob) {
        alert("Please wait for document to load.");
        return;
    }
    try {
        const file = new File([currentFile.blob], `${currentFile.name}.pdf`, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                files: [file],
                title: currentFile.name,
                text: `Datasheet: ${currentFile.name}`
            });
        } else {
            await navigator.share({
                title: currentFile.name,
                url: currentFile.url
            });
        }
    } catch (err) {
        console.error("Share failed", err);
    }
}

function closeDetails() { document.getElementById('detail-layer').classList.add('hidden'); }
function closePdf() { document.getElementById('pdf-overlay').classList.add('hidden'); }

function downloadCurrentFile() { 
    if(!currentFile.blob) return;
    const a = document.createElement('a'); 
    a.href = URL.createObjectURL(currentFile.blob); 
    a.download = `${currentFile.name}.pdf`; 
    a.click(); 
}
</script>
</body>
</html>
